services:
  station:
    # Real GPIO/I2C access on Raspberry Pi needs device permissions inside the
    # container. The base image runs as appuser for laptop/mock mode, but the Pi
    # hardware profile must be able to drive /dev/gpiochip0 directly.
    user: "0:0"
    privileged: true
    build:
      args:
        STATION_PROFILE: full
    environment:
      DETECTION_MODE: real
      HARDWARE_MODE: real
      GPIO_CHIP: ${GPIO_CHIP:-0}
      MODEL_PATH: /models/best.pt
      RTSP_CAMERA_1_URL: ${RTSP_CAMERA_1_URL:-}
      RTSP_CAMERA_2_URL: ${RTSP_CAMERA_2_URL:-}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.45}
      TARGET_FPS: ${TARGET_FPS:-6}
      IMG_SIZE: ${IMG_SIZE:-320}
    deploy:
      resources:
        limits:
          cpus: "3.5"
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/i2c-1:/dev/i2c-1"           
    volumes:
      # Drop your trained weights at ${MODEL_DIR}/best.pt on the host.
      - ${MODEL_DIR:-./backend/model/weights}:/models:ro

  frontend: {}
