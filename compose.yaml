name: search_rescue_system

services:
  db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
      PGTZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/db_init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

  migrate:
    image: postgres:16.9-alpine
    restart: 'no'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backend/database/migrations:/migrations:ro
    command: >
      sh -c 'psql --host=db --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
      --set=ON_ERROR_STOP=1 --file=/migrations/001_reference_data.sql'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
      args:
        API_PORT: ${API_PORT:-8000}
    image: search-rescue-api:0.1.0
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('API_PORT', '8000') + '/health', timeout=5).read(1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - web
      - data

  station:
    build:
      context: .
      dockerfile: backend/station/Dockerfile
      args:
        STATION_PROFILE: ${STATION_PROFILE:-base}
        STATION_PORT: ${STATION_PORT:-8000}
    image: search-rescue-station:0.1.0
    restart: unless-stopped
    environment:
      STATION_HOST: 0.0.0.0
      STATION_PORT: ${STATION_PORT:-8000}
      # Base compose runs fully mocked so it works on a laptop with no hardware.
      DETECTION_MODE: ${DETECTION_MODE:-mock}
      HARDWARE_MODE: ${HARDWARE_MODE:-mock}
      # Talk to the data-api by service name, never localhost.
      API_URL: http://api:${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${STATION_HOST_PORT:-8001}:${STATION_PORT:-8000}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('STATION_PORT', '8000') + '/health', timeout=5).read(1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        FRONTEND_PORT: ${FRONTEND_PORT:-7860}
    image: search-rescue-frontend:0.1.0
    restart: unless-stopped
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: ${FRONTEND_PORT:-7860}
      # Service-name URLs so the frontend reaches the backends inside the network.
      API_URL: http://api:${API_PORT:-8000}
      STATION_URL: http://station:${STATION_PORT:-8000}
      FRONTEND_HTTP_TIMEOUT: ${FRONTEND_HTTP_TIMEOUT:-2.5}
      FRONTEND_BACKEND_COOLDOWN: ${FRONTEND_BACKEND_COOLDOWN:-5.0}
      FRONTEND_AUTO_START_DETECTION: ${FRONTEND_AUTO_START_DETECTION:-false}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${FRONTEND_PORT:-7860}:${FRONTEND_PORT:-7860}"
    depends_on:
      api:
        condition: service_healthy
      station:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('GRADIO_SERVER_PORT', '7860') + '/', timeout=5).read(1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - web

volumes:
  postgres_data:

networks:
  web:
    driver: bridge
  data:
    driver: bridge
    internal: true
