name: search_rescue_system

services:
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
      args:
        API_PORT: ${API_PORT:-8000}
    image: search-rescue-api:0.1.0
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('API_PORT', '8000') + '/health', timeout=5).read(1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - web
      - data

  frontend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        FRONTEND_PORT: ${FRONTEND_PORT:-7860}
    image: search-rescue-frontend:0.1.0
    restart: unless-stopped
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-7860}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: ${FRONTEND_PORT:-7860}
      MODEL_PATH: ${MODEL_PATH:-/app/model/runs/detect/rescue_person_detection_final/weights/best.pt}
      START_MODEL_PATH: ${START_MODEL_PATH:-/app/yolo11n.pt}
      DATA_YAML: ${DATA_YAML:-/app/model/data/data.yaml}
      AUTO_TRAIN_MODEL: ${AUTO_TRAIN_MODEL:-false}
      RTSP_CAMERA_1_URL: ${RTSP_CAMERA_1_URL:-}
    ports:
      - "${FRONTEND_PORT:-7860}:${FRONTEND_PORT:-7860}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('GRADIO_SERVER_PORT', '7860') + '/', timeout=5).read(1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - web

  db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/db_init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

volumes:
  postgres_data:

networks:
  web:
    driver: bridge
  data:
    driver: bridge
    internal: true