name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.12.11'

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/api/requirements.txt
      - run: python -m pip install -r backend/api/requirements.txt pytest
      - run: python -m pytest backend/api/tests -q

  station-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/station/requirements.txt
      - run: python -m pip install -r backend/station/requirements.txt pytest
      - run: python -m pytest backend/station/tests -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: python -m pip install -r frontend/requirements.txt pytest
      - run: python -m pytest frontend/tests -q

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: search_rescue_test
      POSTGRES_USER: sar_test
      POSTGRES_PASSWORD: test_only_password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
